# kittiwake configuration. Every value here is overridable by environment, prefixed KITTIWAKE_
# with __ for nesting: KITTIWAKE_NEST__ORIGIN, KITTIWAKE_DATABASE_URL, and so on.

bind = "127.0.0.1:8080"

# Off by default. Two instances both scheduling against one Postgres is a data problem, so turning
# these on is a deliberate act on exactly one box.
scheduler_enabled = false
warmer_enabled = true

# Absent means the Postgres-backed routes report unavailable rather than pretending.
# database_url = "postgresql://lodestar:...@127.0.0.1:5433/lodestar?sslmode=require"
database_max_connections = 16

# Arbitrum One JSON-RPC. Required for the eligibility oracle, the supply reads and the bounty
# reconciliation; the routes that need it report unavailable without it rather than reaching for a
# public endpoint that would throttle under the directory's fan-out.
# arbitrum_rpc_url = "https://arb1.example/..."

# Ethereum mainnet, for ENS names and the mainnet GRT supply only. Unset means three public
# endpoints are tried in order, which is the normal setup: these are not protocol figures.
# mainnet_rpc_url = "https://eth.example/..."
# A paid endpoint tried only after every one above has failed, so the names survive the public
# endpoints all throttling at once. Bills per call, but on a healthy day nothing reaches it.
# mainnet_rpc_fallback_url = "https://eth.example/..."

# The Dock's BountyBoard, on Arbitrum. Absent means `reconcile-bounties` does not run, which is the
# right answer: with no board there is nothing to reconcile against.
# bounty_board_address = "0x..."

# The Dock remains unavailable unless this is set. The session secret must be the incumbent's
# exact value during the cutover, so existing studio_session cookies survive it.
# [studio]
# session_secret = "a-random-secret-at-least-32-characters-long"
# ipfs_url = "https://api.thegraph.com/ipfs"

[nest]
# Required. There is no second source.
origin = "https://nuthatch.example.sslip.io"
user = "lodestar"
password = ""

# Only needed when a nest is staged somewhere other than its usual path.
# [nest.base_paths]
# alloc = "/alloc-next"

# Must not exceed what the nest itself admits. The protocol nest runs with
# NUTHATCH_SQL_MAX_CONCURRENCY=4 by drop-in; the rest admit two.
# How long a read waits for a permit before it is told the nest is busy. Defaults to 20 seconds,
# which is longer than the slowest cold fold measured: a timeout shorter than the work it guards
# does not shed load, it stops the work finishing. Uncomment only to deviate.
# read_queue_timeout_secs = 20

[nest.permits]
# Four, because that is what the nest admits: `NUTHATCH_SQL_MAX_CONCURRENCY=4` on the allocations
# nest. The rule above is not advice - a pool wider than the nest means the surplus is sent anyway
# and shed, and `nest_busy` climbs while every page shows a console error for work the backend was
# never able to take.
#
# It was briefly eight, as a mitigation for a fold that starved itself by needing more permits than
# existed. That is fixed properly in `many()`, which admits at most `lane_width - 1` at a time, so
# a six-part fold fits inside four permits and the mitigation is no longer needed. Raising this
# again only moves the shedding from kittiwake's gate to the nest's.
alloc = 4
gns = 2
dips = 2
"dips-sepolia" = 2
"legacy-flows" = 2
qos = 2

[cache]
max_entries = 8192
# Bump to retire every key at once when a response shape changes.
schema_version = 1

[limits]
sql_per_minute = 10
read_per_minute = 120
mutation_per_minute = 30
# Foghorn's hourly read. Its reads still go through the cache, so it adds close to zero nest load.
exempt_ips = []

# Signing key for SQL receipts, 32 bytes of hex. Leave the section out and this deployment issues
# none, which is a posture rather than a fault: a reader can still sign an answer themselves with
# `tattler attest-named` and their own key. Keep the key stable across restarts, or every receipt
# already issued is signed by a public key nobody can look up any more.
# [receipt]
# issuer_key = "..."

# Foghorn's API, which `/api/foghorn/{*path}` proxies. Leave it out and that route answers 503
# rather than guessing at a host. Both services sit on this box, so this is normally loopback.
# foghorn_api_url = "http://127.0.0.1:8081"

# The indexer-agent management API that `/api/indexer/present-poi` queues actions against. The
# token belongs to this URL and travels only here: a caller who nominates their own agent brings
# their own credential, because the SSRF check refuses private addresses and not attacker-owned
# public ones.
# [indexer_agent]
# url = "http://127.0.0.1:18000"
# token = "user:password"
