[package]
name = "kittiwake-nest"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
futures = "0.3.34"
kittiwake-cache = { version = "0.1.0", path = "../cache" }
kittiwake-types = { version = "0.1.0", path = "../types" }
metrics = "0.24.6"
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "gzip", "http2", "charset", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
wiremock = "0.6.5"
