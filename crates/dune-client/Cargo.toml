[package]
name = "dune-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Read-only ledger integration: look up what an execution cost, and what the account has spent.
# Neither can start a query, so a binary can enforce a spending ceiling without gaining the
# ability to spend.
ledger = ["dep:dune-ledger"]
# Adds `execute`. Implies `ledger`. Only enable it where starting a paid query is intended.
executions = ["ledger"]

[dependencies]
dune-ledger = { path = "../dune-ledger", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "query"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time"] }

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
tokio = { version = "1.53.1", features = ["full"] }
wiremock = "0.6.5"
