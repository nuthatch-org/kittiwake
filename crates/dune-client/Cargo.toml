[package]
name = "dune-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
executions = ["dep:dune-ledger"]

[dependencies]
dune-ledger = { path = "../dune-ledger", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "query"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time"] }

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
tokio = { version = "1.53.1", features = ["full"] }
wiremock = "0.6.5"
