[package]
name = "kittiwake-ext"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
bytes = "1.11.1"
prost = "0.14.4"
kittiwake-cache = { version = "0.1.0", path = "../cache" }
kittiwake-ssrf = { version = "0.1.0", path = "../ssrf" }
kittiwake-types = { version = "0.1.0", path = "../types" }
metrics = "0.24.6"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls", "gzip", "http2", "charset", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "chrono", "json", "macros"] }
tokio = "1.53.1"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
wiremock = "0.6.5"
