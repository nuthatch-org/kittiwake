[package]
name = "kittiwake-parity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kittiwake-parity"
path = "src/bin/parity.rs"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "gzip", "http2", "charset", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
