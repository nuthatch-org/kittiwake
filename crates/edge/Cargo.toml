[package]
name = "kittiwake-edge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros", "json"] }
bytes = "1.11.1"
governor = "0.10.4"
http = "1.5.0"
chrono = "0.4.45"
kittiwake-cache = { version = "0.1.0", path = "../cache" }
kittiwake-chain = { version = "0.1.0", path = "../chain" }
kittiwake-config = { version = "0.1.0", path = "../config" }
kittiwake-db = { version = "0.1.0", path = "../db" }
kittiwake-dock = { version = "0.1.0", path = "../dock" }
kittiwake-ext = { version = "0.1.0", path = "../ext" }
kittiwake-nest = { version = "0.1.0", path = "../nest" }
kittiwake-obs = { version = "0.1.0", path = "../obs" }
kittiwake-disasm = { version = "0.1.0", path = "../disasm" }
kittiwake-read = { version = "0.1.0", path = "../read" }
kittiwake-rewards = { version = "0.1.0", path = "../rewards" }
kittiwake-score = { version = "0.1.0", path = "../score" }
kittiwake-scuttle = { version = "0.1.0", path = "../scuttle" }
kittiwake-sqlplay = { version = "0.1.0", path = "../sqlplay" }
kittiwake-ssrf = { version = "0.1.0", path = "../ssrf" }
kittiwake-types = { version = "0.1.0", path = "../types" }
# The receipt format, rather than a second implementation of it. Issuing and verifying must
# share one canonical encoding: two implementations are two sets of decisions about key ordering
# and number formatting, and the day they disagree a verifier reports a forgery that never
# happened. The incumbent compiles this same crate to wasm to avoid exactly that. #19
tattler = { git = "https://github.com/nightswatchhq/tattler.git", rev = "0d94f0bdea9d7d854c69d78f0b4f13d72184e091", default-features = false }
anyhow = "1.0.104"
ed25519-dalek = "2.2.0"
hex = "0.4.3"
metrics = "0.24.6"
reqwest = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync", "time", "rt"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors", "request-id", "util", "catch-panic", "timeout"] }
futures = "0.3.34"
subtle = "2.6.1"
tracing = "0.1.44"
base64 = "0.23.1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
