[package]
name = "kittiwake-scuttle"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
hmac = "0.12.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["sync", "time"] }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
