[package]
name = "kittiwake-sched"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
cron = "0.17.0"
futures = "0.3.34"
kittiwake-db = { version = "0.1.0", path = "../db" }
kittiwake-ingest = { version = "0.1.0", path = "../ingest" }
kittiwake-nest = { version = "0.1.0", path = "../nest" }
kittiwake-types = { version = "0.1.0", path = "../types" }
metrics = "0.24.6"
rand = "0.10.2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
