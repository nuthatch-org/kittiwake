[package]
name = "kittiwake-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
kittiwake-types = { version = "0.1.0", path = "../types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "macros", "migrate", "chrono", "uuid", "json"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "rt"] }
tracing = "0.1.44"
