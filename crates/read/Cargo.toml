[package]
name = "kittiwake-read"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = "0.4.45"
futures = "0.3.34"
kittiwake-cache = { version = "0.1.0", path = "../cache" }
kittiwake-db = { version = "0.1.0", path = "../db" }
kittiwake-nest = { version = "0.1.0", path = "../nest" }
kittiwake-types = { version = "0.1.0", path = "../types" }
metrics = "0.24.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = "1.53.1"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
wiremock = "0.6.5"
