name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The `query!` macros check themselves against `.sqlx/`, which is committed, so CI needs no
  # database. Without this they would try to reach one and the build would fail with a confusing
  # message about DATABASE_URL rather than a clear one about the cache. A query changed without
  # `cargo sqlx prepare` being re-run fails here, which is the point. #2
  SQLX_OFFLINE: "true"
  # The commands the check job runs live in yatr.toml. Bump deliberately.
  YATR_VERSION: "1.1.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        # Not this workspace's -D warnings: yatr is another crate.
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""
      - run: yatr fmt-check
      - run: yatr lint
      # No network and no database: every test runs against an in-process mock nest.
      - run: yatr test
      # The statements nuthatch's release gate replays; a change to sql.rs that leaves them stale fails here.
      - run: yatr queries-check

  release:
    # The binary a deploy installs, so `deploy/install.sh` stops depending on whoever's laptop has
    # a working Docker. Built in bookworm rather than on the runner for the reason
    # `deploy/build-linux.sh` gives: glibc is forward compatible and not backward, the box is 2.39,
    # and building against exactly 2.39 leaves no margin at all.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin kittiwake --bin lodestar-cockpit
      - run: objdump -T target/release/kittiwake | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3
      # Seven days, not thirty: every build on main uploads ~10 MB, a private repo on the free plan
      # has 500 MB of artifact storage, and thirty days of builds filled it on 2026-09-29 and failed
      # v0.3.0's release. A week is the rollback window `deploy/ship.sh <run-id>` needs; older than
      # that is a rebuild.
      - uses: actions/upload-artifact@v4
        with:
          name: kittiwake-linux-x86_64
          path: target/release/kittiwake
          retention-days: 7
      # What an indexer runs beside its own agent for a self-hosted /cockpit (lodestar#259).
      - uses: actions/upload-artifact@v4
        with:
          name: lodestar-cockpit-linux-x86_64
          path: target/release/lodestar-cockpit
          retention-days: 7
